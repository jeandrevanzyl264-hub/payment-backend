<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f7f6; color: #333; }
        header { background: #1a1a2e; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #0f3460; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-paid { background: #d4edda; color: #155724; }
        .badge-pending { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <header>
        <h1>Admin Sales Dashboard</h1>
        <a href="/" style="color:white; text-decoration:none;">← Back to Site</a>
    </header>

    <div class="container">
        <h2>Recent Transactions</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Customer Email</th>
                    <th>Amount (ZAR)</th>
                    <th>Reference</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="orders-table">
                <tr><td colspan="5">Loading orders...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchOrders() {
            const res = await fetch('/api/orders');
            const orders = await res.json();
            const tableBody = document.getElementById('orders-table');
            
            tableBody.innerHTML = '';
            
            orders.forEach(order => {
                const date = new Date(order.createdAt).toLocaleString();
                const badgeClass = order.status === 'Paid' ? 'badge-paid' : 'badge-pending';
                
                tableBody.innerHTML += `
                    <tr>
                        <td>${date}</td>
                        <td>${order.email}</td>
                        <td>R ${order.amount.toFixed(2)}</td>
                        <td><code>${order.reference || 'N/A'}</code></td>
                        <td><span class="badge ${badgeClass}">${order.status}</span></td>
                    </tr>
                `;
            });
        }

        fetchOrders();
    </script>
</body>
</html>
